name: Leade.rs
description: >-
  Leade.rs, Inc. was a two-sided marketplace that matched keynote, motivational, and business
  speakers with the conferences, corporate events, brands, and press that wanted to book them.
  Event organizers could search a curated roster and create an event, while speakers maintained a
  profile covering their availability and topics — the platform's stated aim was to remove the
  cold-outreach grind from conference programming and surface newer and more diverse voices.
  The company was co-founded by Loïc Le Meur, the French entrepreneur behind the LeWeb conference
  and a Silicon Valley angel investor; at acquisition its network was reported at roughly 300
  speakers across 11 core fields including crypto, AI, and entrepreneurship. ASX-listed Animoca
  Brands acquired 100% of the equity on 6 May 2019 for US$0.5 million upfront, intending to grow
  the roster into a mentor and investor network bridging East and West alongside its Zeroth
  accelerator, with Le Meur joining Animoca as a venture partner. The product did not survive the
  acquisition. Leade.rs never published a public API, developer portal, SDK, or machine-readable
  documentation, and as of the July 2026 enrichment pass the leade.rs domain no longer resolves —
  it remains registered through December 2026 and is delegated to EuroDNS nameservers, but the
  zone is not served, so there is no live surface of any kind to harvest. This profile is retained
  as a historical company record.
