  the domain returns no A record and curl fails to resolve (HTTP 000) as of 2026-07-19. Wayback
  shows a domain-parking placeholder served from at least 2024-07 through the last capture on
  2026-01-13; the parking page returns HTTP 200 HTML for every path, including /.well-known/*,
  so archived .well-known 200s are parking noise and not real artifacts.
